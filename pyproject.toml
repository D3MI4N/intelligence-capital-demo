[project]
name = "intelligence-capital-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.1",
    "openai>=2.48.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sqlite-vec>=0.1.9",
    "tiktoken>=0.13.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["\\.venv"]

# The vector extension ships no type stubs.
[[tool.mypy.overrides]]
module = ["sqlite_vec.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
